[package]
name = "soxu-agent-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
soxu-pi-protocol = { path = "../pi-protocol" }
# 重试预算快照需要 derive；serde 已通过 serde_json 在依赖图中，这里只启用 derive 特性。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
] }

# 仅测试用：P-03 进程树清理验收需要判断「某个 PID 是否还活着」。
# 不引入新的第三方包——windows-sys 0.61 已在 Cargo.lock（tauri 依赖树）中，
# 且只用于 Windows 的 OpenProcess / GetExitCodeProcess 查询。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
