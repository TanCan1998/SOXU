[package]
name = "soxu-desktop"
version = "0.1.0"
description = "SOXU lightweight multi-agent desktop workspace"
authors = ["SOXU contributors"]
edition = "2024"

[lib]
name = "soxu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon：关闭窗口最小化到系统托盘（Issue #90）。Linux 侧该特性用 libloading
# 在运行时加载 libayatana-appindicator，构建期不需要额外的 -dev 包。
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# 系统目录选择器：只用来让用户挑「添加项目」的目录，不开放其他文件访问。
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soxu-pi-protocol = { path = "../../../crates/pi-protocol" }
soxu-agent-runtime = { path = "../../../crates/agent-runtime" }
soxu-session-index = { path = "../../../crates/session-index" }
soxu-git-worktree = { path = "../../../crates/git-worktree" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
