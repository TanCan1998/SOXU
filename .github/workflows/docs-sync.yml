name: Docs sync

# 改了产品代码却没有任何文档变更的 PR 会被拦下。
# 豁免：PR 描述里写 [skip docs]。
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    name: Docs sync gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation sync
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-docs-sync.mjs
