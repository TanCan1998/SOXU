name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify tag is on main with successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-context.mjs

  binaries:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        # libayatana-appindicator3-dev 是 tauri 2 tray 的构建依赖：缺它时 tauri-cli 会
        # panic「Can't detect any appindicator library」并以 134 退出（2026-10-30 首次真实构建暴露）。
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generate approved SOXU desktop icons
        run: pnpm icons:generate
      - run: cargo test --workspace --locked
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'SOXU ${{ github.ref_name }}'
          releaseBody: "SOXU ${{ contains(github.ref_name, '-rc.') && 'prerelease' || 'release' }}. Unsigned/not-notarized builds may require OS trust prompts."
          releaseDraft: false
          # rc tag 才是预发布；正式 tag（v0.x.y）必须产出正式 Release。
          prerelease: "${{ contains(github.ref_name, '-rc.') }}"
