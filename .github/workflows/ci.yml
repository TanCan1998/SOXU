name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks are wasteful. Never cancel a main-branch check:
# release verification requires a successful CI run for the exact main SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            js:
              - '.github/workflows/**'
              - 'apps/desktop/src/**'
              # 纯 Rust 改动也要跑 quality：pnpm check 里的 check-command-blocks.mjs
              # 校验 apps/desktop/src-tauri/src/lib.rs 的领域占位块。
              # 不加这条的话，只改 Rust 的 PR 会 skip quality，而 GitHub 把 skipped
              # job 报成 Success，required check 形同虚设（三轨 2026-10-30 发现）。
              - 'apps/desktop/src-tauri/src/**'
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/vite.config.ts'
              - 'packages/**'
              - 'automation/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            rust:
              # Compile native code only when its sources, manifest, or CI recipe change.
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/build.rs'
              - 'apps/desktop/src-tauri/tauri.conf.json'
              - 'apps/desktop/src-tauri/capabilities/**'
              - 'apps/desktop/src-tauri/src/**'

  quality:
    name: quality (${{ matrix.node }})
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @soxu/desktop build

  rust:
    name: Rust / Tauri
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        id: node-cache
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        id: cargo-cache
        with:
          shared-key: ci-linux
      # Cache downloaded packages only, never the installed system or package indexes.
      # Refresh indexes on every run so APT still verifies current repository metadata.
      - name: Prepare APT cache key
        id: apt-key
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/apt-packages"
      - name: Restore APT package cache
        id: apt-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/apt-packages
          key: apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-key.outputs.image }}-${{ steps.apt-key.outputs.week }}
          restore-keys: |
            apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-key.outputs.image }}-
      - name: Stage cached APT packages
        run: |
          sudo cp -n "$RUNNER_TEMP"/apt-packages/*.deb /var/cache/apt/archives/ 2>/dev/null || {
            if compgen -G "$RUNNER_TEMP/apt-packages/*.deb" >/dev/null; then
              echo "Failed to stage cached packages" >&2
              exit 1
            fi
          }
      - name: Update APT indexes
        run: sudo apt-get update
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$RUNNER_TEMP/apt-packages" {} +
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-packages"
          if ! compgen -G "$RUNNER_TEMP/apt-packages/*.deb" >/dev/null; then
            echo "::warning::APT package cache is empty after installation"
          fi
      - name: Save APT package cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/apt-packages
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Report cache and timing guidance
        if: ${{ always() }}
        env:
          NODE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
          CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          APT_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          APT_MATCHED_KEY: ${{ steps.apt-cache.outputs.cache-matched-key }}
        run: |
          {
            echo "### Rust / Tauri cache and timings"
            echo "- pnpm cache hit: ${NODE_HIT:-unavailable}; see restore log for details."
            echo "- Cargo exact cache hit: ${CARGO_HIT:-unavailable}; see restore log for fallback or miss."
            echo "- APT cache hit: ${APT_HIT:-miss or unavailable}; matched key: ${APT_MATCHED_KEY:-none}."
            echo "- Compare restore, APT update/install/save, Cargo test and post-job cache-save durations in the step logs."
            echo "- Cache hits and size alone do not establish time saved; compare similar cold and warm runs, including cache overhead."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate approved SOXU desktop icons
        run: pnpm icons:generate
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      # cargo test compiles workspace targets; avoid duplicating that work with cargo check.
      - name: Test Rust workspace
        run: cargo test --workspace --locked

  gate:
    name: SOXU CI Gate
    needs: [changes, quality, rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs for changed areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          JS_CHANGED: ${{ needs.changes.outputs.js }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          set -eu
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change detection did not succeed"; exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            js_required=true
            rust_required=true
          else
            js_required="$JS_CHANGED"
            rust_required="$RUST_CHANGED"
          fi
          for value in "$js_required" "$rust_required"; do
            if [[ "$value" != true && "$value" != false ]]; then
              echo "Change detection did not return a valid result"; exit 1
            fi
          done
          if [[ "$js_required" == true && "$QUALITY_RESULT" != success ]] || [[ "$js_required" == false && "$QUALITY_RESULT" != skipped ]]; then
            echo "Node checks do not match detected changes"; exit 1
          fi
          if [[ "$rust_required" == true && "$RUST_RESULT" != success ]] || [[ "$rust_required" == false && "$RUST_RESULT" != skipped ]]; then
            echo "Rust checks do not match detected changes"; exit 1
          fi
          echo "Required CI jobs completed successfully"
