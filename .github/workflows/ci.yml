name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks are wasteful. Never cancel a main-branch check:
# release verification requires a successful CI run for the exact main SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            js:
              - '.github/workflows/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/vite.config.ts'
              - 'packages/**'
              - 'automation/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            rust:
              # Compile native code only when its sources, manifest, or CI recipe change.
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/build.rs'
              - 'apps/desktop/src-tauri/tauri.conf.json'
              - 'apps/desktop/src-tauri/capabilities/**'
              - 'apps/desktop/src-tauri/src/**'

  quality:
    name: quality (${{ matrix.node }})
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @soxu/desktop build

  rust:
    name: Rust / Tauri
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        id: node_setup
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        id: cargo_cache
        with:
          shared-key: ci-linux
      - name: Prepare APT cache key
        id: apt_key
        run: |
          mkdir -p "$RUNNER_TEMP/soxu-apt-archives"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore APT package archives
        id: apt_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/soxu-apt-archives
          key: apt-ubuntu-24.04-${{ runner.arch }}-${{ env.ImageVersion }}-${{ steps.apt_key.outputs.week }}-v1
          restore-keys: |
            apt-ubuntu-24.04-${{ runner.arch }}-${{ env.ImageVersion }}-
      - name: Refresh APT indexes
        run: sudo apt-get update
      - name: Install Linux Tauri prerequisites
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/soxu-apt-archives/*.deb)
          if (( ${#packages[@]} )); then
            sudo cp -n "${packages[@]}" /var/cache/apt/archives/
          fi
          sudo apt-get install -y --no-install-recommends -o Binary::apt::APT::Keep-Downloaded-Packages=true libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$RUNNER_TEMP/soxu-apt-archives" {} +
      - name: Save APT package archives
        if: steps.apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/soxu-apt-archives
          key: apt-ubuntu-24.04-${{ runner.arch }}-${{ env.ImageVersion }}-${{ steps.apt_key.outputs.week }}-v1
      - name: Report cache status
        if: always()
        env:
          NODE_CACHE: ${{ steps.node_setup.outputs.cache-hit }}
          CARGO_CACHE: ${{ steps.cargo_cache.outputs.cache-hit }}
          APT_CACHE: ${{ steps.apt_cache.outputs.cache-hit }}
        run: |
          {
            echo '### Rust / Tauri cache observations'
            echo "- pnpm: ${NODE_CACHE:-not reported}"
            echo "- Cargo: ${CARGO_CACHE:-not reported}"
            echo "- APT: ${APT_CACHE:-miss or unavailable} (false means a restore-key match)"
            echo '- See the individual step timestamps and post-job cache save in the log to compare elapsed time. Cache hits alone do not establish a speedup.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate approved SOXU desktop icons
        run: pnpm icons:generate
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      # cargo test compiles workspace targets; avoid duplicating that work with cargo check.
      - name: Test Rust workspace
        run: cargo test --workspace --locked

  gate:
    name: SOXU CI Gate
    needs: [changes, quality, rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs for changed areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          JS_CHANGED: ${{ needs.changes.outputs.js }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        shell: bash
        run: |
          set -eu
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change detection did not succeed"; exit 1
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            js_required=true
            rust_required=true
          else
            js_required="$JS_CHANGED"
            rust_required="$RUST_CHANGED"
          fi
          for value in "$js_required" "$rust_required"; do
            if [[ "$value" != true && "$value" != false ]]; then
              echo "Change detection did not return a valid result"; exit 1
            fi
          done
          if [[ "$js_required" == true && "$QUALITY_RESULT" != success ]] || [[ "$js_required" == false && "$QUALITY_RESULT" != skipped ]]; then
            echo "Node checks do not match detected changes"; exit 1
          fi
          if [[ "$rust_required" == true && "$RUST_RESULT" != success ]] || [[ "$rust_required" == false && "$RUST_RESULT" != skipped ]]; then
            echo "Rust checks do not match detected changes"; exit 1
          fi
          echo "Required CI jobs completed successfully"
