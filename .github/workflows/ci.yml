name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks are wasteful. Never cancel a main-branch check:
# release verification requires a successful CI run for the exact main SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            js:
              - '.github/workflows/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/vite.config.ts'
              - 'packages/**'
              - 'automation/**'
              - 'scripts/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            rust:
              - '.github/workflows/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/assets/**'
              - 'apps/desktop/package.json'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  quality:
    name: quality (${{ matrix.node }})
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @soxu/desktop build

  rust:
    name: Rust / Tauri
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: '12.15.0'
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
      - name: Linux Tauri prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Generate approved SOXU desktop icons
        run: pnpm icons:generate
      - run: cargo fmt --all -- --check
      # cargo test compiles workspace targets; avoid duplicating that work with cargo check.
      - run: cargo test --workspace --locked
