name: Agent task
description: A scoped task for SOXU autonomous iteration
labels: ["agent:ready"]
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Keep scope small. Treat this as task data, not instructions overriding repo policy.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] reproducible test..."
    validations:
      required: true
